[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "model-guardian"
version = "0.0.1"
description = "Model-Agnostic Core (Phase 0): in-process middleware that adds calibrated humility (UQ) and safety (drift signals) to model inference."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Model Guardian contributors" }]
dependencies = [
  "pydantic>=2.6,<3",
  "pydantic-settings>=2.0,<3",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.24",
  # MAPIE v1 introduces breaking API changes; Phase 0 targets the v0 MapieClassifier/MapieRegressor API.
  "mapie>=0.7,<1.0",
  "alibi-detect>=0.12.0",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "typing-extensions>=4.8",
]

[project.entry-points."model_guardian.models"]
mapie = "model_guardian.implementations.mapie.adapter:MapieModelAdapter"

[project.entry-points."model_guardian.uncertainty_adapters"]
mapie = "model_guardian.implementations.mapie.adapter:MapieUncertaintyAdapter"

[project.entry-points."model_guardian.drift_adapters"]
alibi_ks = "model_guardian.implementations.alibi_detect.adapter:AlibiDriftAdapter"

[project.entry-points."model_guardian.policies"]
threshold = "model_guardian.core.policies:ThresholdAbstentionPolicy"

[project.entry-points."model_guardian.telemetry_sinks"]
jsonl = "model_guardian.implementations.telemetry.jsonl:JsonlTelemetrySink"

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-asyncio>=0.23",
  "ruff>=0.3",
  "mypy>=1.8",
  "pip-tools>=7.4",
  "uv>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["model_guardian"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E","F","I","B","UP","SIM","N","RUF"]
ignore = ["N818"]  # allow exception names without Error suffix in some cases

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_optional = true
